name: Release

on:
  push:
    tags:
      # 只接受三段 SemVer tag（vMAJOR.MINOR.PATCH）；四段版本不是合法 SemVer。
      # 用 Actions 的 glob 语法（* 匹配任意串），不要写正则 —— 之前这里是
      # "v[0-9]+.[0-9]+.[0-9]+"，把正则塞进 glob 字段，靠 + 的「前一字符一个或多个」
      # 才勉强匹配上，换人改就容易废（2026-11-25 v1.2.1 排查时定位到）。
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发的版本 tag（例如 v1.2.1）；留空则用触发这次运行的 ref"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 手动补发（workflow_dispatch）从 main 触发时，签出的仍必须是被发布的那个 tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... -race

      - name: Run lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 手动补发（workflow_dispatch）从 main 触发时，签出的仍必须是被发布的那个 tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc -b

      - name: Run tests
        run: bun run test

  build:
    needs: [test-backend, test-frontend]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 手动补发（workflow_dispatch）从 main 触发时，签出的仍必须是被发布的那个 tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:buildcache-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 手动补发（workflow_dispatch）从 main 触发时，签出的仍必须是被发布的那个 tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # 手动补发时 ref 是 main，版本号只能从输入拿；tag 推送时两者等价
          RELEASE_TAG="${{ inputs.tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          VERSION=${RELEASE_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMG=${{ env.REGISTRY }}/${{ steps.version.outputs.image_name }}
          VER=${{ steps.version.outputs.version }}
          TAGS="-t $IMG:latest -t $IMG:$VER -t $IMG:${{ steps.version.outputs.minor }} -t $IMG:${{ steps.version.outputs.major }}"
          docker buildx imagetools create $TAGS $(printf "$IMG@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        env:
          # 用 gh CLI 必须显式给 token：原 action 会自己注入，run 步骤不会
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 路径在 shell 里拼：写在 env 值里的 `${VAR}` 既不会被 Actions 展开、
          # bash 也不会递归展开（2026-10-10 v1.1.2 踩过 —— 路径永远匹配不到，
          # 于是每次都回落到自动生成的提交历史）。
          # 文件名带 v 前缀（docs/releases/v1.1.1.md），而 version 输出已剥掉 v。
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_TAG="${{ steps.version.outputs.tag }}"
          NOTES="docs/releases/v${VERSION}.md"
          if [ -s "$NOTES" ]; then
            # 人工撰写的分类更新说明（docs/releases/vX.Y.Z.md）；缺失时回落到自动生成
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
